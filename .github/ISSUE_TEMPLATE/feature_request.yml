name: Feature request
description: Suggest a focused, safety-aware improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the user problem, not just a preferred implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
      description: Explain the expected workflow and any alternatives you considered.
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Safety and privacy impact
      description: Explain whether this could change files, expose local paths or media, or alter review confidence.
      placeholder: This proposal does not mutate files; it only adds an additional review aid.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and read the relevant README section.
          required: true
        - label: I did not include private media or identifying library paths.
          required: true
